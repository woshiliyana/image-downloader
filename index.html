<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片预览与批量下载</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX'); // 需要替换为您的Google Analytics ID
    </script>
</head>
<body>
    <div class="container">
        <h1>图片预览与批量下载</h1>
        
        <!-- 广告容器已隐藏 -->
        
        <div class="input-section">
            <button id="paste-btn">从剪贴板粘贴图片链接</button>
            <p class="hint">或者直接在下方文本框中粘贴图片链接（每行一个链接）</p>
            <textarea id="image-urls" placeholder="在此粘贴图片链接，每行一个..."></textarea>
            <button id="preview-btn">预览图片</button>
        </div>

        <div class="controls">
            <button id="select-all">全选</button>
            <button id="deselect-all">取消全选</button>
            <button id="download-selected" disabled>下载选中图片</button>
            <span id="selected-count">已选择: 0 张图片</span>
        </div>

        <div class="gallery" id="image-gallery">
            <!-- 图片预览将在这里显示 -->
            <div class="empty-state">
                粘贴图片链接后，预览将显示在这里
            </div>
        </div>
    </div>

    <footer>
        <p class="footer-text">© 2025 <span class="author">NaNa的窄门</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
